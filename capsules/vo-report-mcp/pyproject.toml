[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vo-report-mcp"
version = "0.1.0"
description = "An MCP server to generate scientific report about a polygon area based on shapefile data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosseclient>=0.1.8",
  "fastmcp>=2.10.6",
  "httpx>=0.28.1",
  "loguru>=0.7.3",
  "boto3>=1.35.0",
  "python-dotenv>=1.0.0",
  "markdown>=3.5.0",
  "weasyprint>=62.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["alquimia*"]

[dependency-groups]
dev = [
    "pdoc3>=0.11.6",
    "ruff>=0.12.9",
]
